[project]
name = "pj04-paraworks"
version = "0.1.0"
description = "ParaWorks service harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "celery>=5.6.0",
    "fastapi>=0.133.0",
    "httpx>=0.28.1",
    "langchain>=1.3.17,<1.4.0",
    "langchain-google-genai>=4.3.5,<4.4.0",
    "langchain-openai>=1.6.0,<1.7.0",
    "langsmith>=0.8.0,<0.9.0",
    "langgraph>=1.2.11,<1.3.0",
    "langgraph-checkpoint-postgres>=3.1.2,<3.2.0",
    "pgvector>=0.4.2",
    "psycopg[binary,pool]>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "redis>=7.0.1",
    "reportlab>=4.5.0",
    "sqlalchemy>=2.0.45",
    "tiktoken>=0.12.0,<0.13.0",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
]
ignore = [
    "E501",
    "N803",
    'N812',
    'E401',
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"*.py" = ["ANN", "INP001"]

[tool.mypy]
ignore_missing_imports = true
